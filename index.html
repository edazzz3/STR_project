<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Просмотр STR</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="sidebar" class="collapsed">
  <div class="sidebar-header">Слои</div>
  <div class="sidebar-body"></div>
</div>

<div id="top">
  <label class="btn">Импорт <input type="file" id="fileInput" multiple></label>
  <label class="chk"><input type="checkbox" id="swap"> swap X/Y</label>
  <button id="fieldsBtn" title="Отображение полей у точек">👁</button>
  <label class="switch"><span>2D</span><input type="checkbox" id="mode3d"><span class="track"></span><span>3D</span></label>
  <button id="pickPivot" title="Выбрать точку вращения (3D)">⌖</button>
  <button id="fit">показать все</button>
  <button id="georef">Привязать PDF</button>
</div>
<canvas id="c"></canvas>
<canvas id="c3"></canvas>
<div id="info">Откройте файл .str (кнопка Импорт)</div>
<div id="loader" hidden><div class="spinner"></div><span>Загрузка 3D…</span></div>

<!-- Модал полей -->
<div id="fieldsModal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-body">
    <div class="modal-step step-1">
      <div class="modal-title">Выберите стринги</div>
      <div class="modal-list" id="fieldsStreamList"></div>
      <div class="modal-actions">
        <div class="modal-actions-right">
          <button id="fieldsNext" class="primary">Далее</button>
        </div>
      </div>
    </div>
    <div class="modal-step step-2" hidden>
      <div class="modal-title">Выберите поля (макс. 2)</div>
      <div class="modal-list" id="fieldsList"></div>
      <label class="modal-round"><input type="checkbox" id="fieldsRound"> Округлить до 1 знака</label>
      <div class="modal-actions">
        <button id="fieldsBack">Назад</button>
        <div class="modal-actions-right">
          <button id="fieldsReset">Сброс</button>
          <button id="fieldsApply" class="primary">Применить</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Модал привязки PDF -->
<div id="georefModal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-body">
    <div class="modal-title">Привязка PDF</div>
    <div class="modal-list" id="georefList"></div>
    <div class="modal-rms" id="georefRms"></div>
    <div class="modal-actions">
      <button id="georefCancel">Отмена</button>
      <div class="modal-actions-right">
        <button id="georefAdd">Добавить пару</button>
        <button id="georefApply" class="primary" disabled>Применить</button>
      </div>
    </div>
  </div>
</div>

<!-- Плавающая подсказка -->
<div id="georefTip" hidden>
  <span id="georefTipText"></span>
  <button id="georefTipCancel">Отмена</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
